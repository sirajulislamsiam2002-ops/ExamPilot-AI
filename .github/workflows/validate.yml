name: Validate Academia Studio
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/academia-studio-supabase-app, feature/cloudflare-web-build, feature/student-portal-upgrade-2026-11-21]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run typecheck
      - run: npx expo-doctor
      - run: npm run web:build
